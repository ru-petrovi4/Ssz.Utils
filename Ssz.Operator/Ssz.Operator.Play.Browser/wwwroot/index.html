<!DOCTYPE html>
<html>

<head>
    <title>Cdt.Operator.Play.Browser</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./app.css" />
</head>

<body style="margin: 0; overflow: hidden">
    <div id="out"></div>

    <div id="app-loading" class="app-loading">
        <div class="app-loading__panel">
            <div class="app-loading__title">Cdt.Operator.Play</div>
            <div class="app-loading__status" id="app-loading-status">Подготовка к загрузке...</div>
            <div class="app-loading__track" id="app-loading-track" role="progressbar" aria-valuemin="0"
                 aria-valuemax="100" aria-valuenow="0">
                <div class="app-loading__fill" id="app-loading-fill"></div>
            </div>
            <div class="app-loading__details">
                <span id="app-loading-percent">0%</span>
                <span id="app-loading-files"></span>
            </div>
            <pre class="app-loading__error" id="app-loading-error" hidden></pre>
            <div class="app-loading__powered">
                Powered by <a href="https://www.avaloniaui.net/" target="_blank" rel="noopener">Avalonia UI</a>
            </div>
        </div>
    </div>

    <script type='module' src="./main.js"></script>
    <script src="/_framework/aspnetcore-browser-refresh.js"></script>
</body>

</html>
